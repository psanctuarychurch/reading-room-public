<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
  <title id="t">The reading room, for visitors</title>
  <desc id="d">Psanctuary Church · Reading Room: What the church has chosen to share, and the door to the rest. A mycelium of blue threads grows from the church's node toward the families it weaves together (amber, purple, teal, emerald, magenta). The threads draw themselves and the nodes arrive one by one; with reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block every element is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .t { stroke-dasharray: 100; animation: grow 2.6s cubic-bezier(.4,0,.2,1) both; }
      .t0 { animation-delay: .2s } .t1 { animation-delay: .5s } .t2 { animation-delay: .8s } .t3 { animation-delay: 1.1s } .t4 { animation-delay: 1.4s }
      .h { stroke-dasharray: 100; animation: grow 1.6s ease-out 2.2s both; }
      .n { animation: arrive .5s ease-out both; }
      .n0 { animation-delay: 2.5s } .n1 { animation-delay: 2.8s } .n2 { animation-delay: 3.1s } .n3 { animation-delay: 3.4s } .n4 { animation-delay: 3.7s }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 4.2s ease-out 4.2s infinite; }
      .hub { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out 1s infinite; }
      .spore { animation: drift 9s ease-in-out infinite alternate; }
    }
    @keyframes grow { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes halo { 0% { opacity: .6; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.2) } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(-14px, -8px) } }
    .halo { opacity: 0 }
    .t { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .9 }
    .h { fill: none; stroke: #60a5fa; stroke-width: 1.2; stroke-linecap: round; opacity: .55 }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#132a63"/><stop offset="1" stop-color="#0b1a3d"/></linearGradient>
    <radialGradient id="glow" cx=".75" cy=".55" r=".45"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>
