      <text x="56" y="178" font-size="20" fill="#dbeafe">What the church has chosen to share, and the door to the rest.</text>
      <text x="56" y="206" font-size="14" fill="#93c5fd" letter-spacing=".4">decks · procedures · start here · ask for access</text>
    </g>
  </g>
